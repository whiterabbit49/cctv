<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCTV Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>body{font-family:system-ui;margin:0;background:#111;color:#eee}main{max-width:960px;margin:0 auto;padding:12px;height:100vh;height:100dvh;box-sizing:border-box;display:flex;flex-direction:column}video{width:100%;background:#000;border-radius:8px;flex-shrink:0}#list{margin-top:12px;display:flex;flex-direction:column;gap:6px;flex:1;overflow-y:auto;min-height:0}.row{background:#222;border:0;color:#eee;text-align:left;padding:10px;border-radius:6px;cursor:pointer}.row.live{border:1px solid #e33}.row.active{background:#333}input{padding:8px;border-radius:6px;border:0}#bar{display:flex;gap:8px;margin:12px 0}.day{color:#999;font-size:12px;padding:4px 2px;margin-top:8px}@media(min-width:768px){main{max-width:1400px;display:grid;grid-template-columns:1fr 320px;grid-template-areas:"head head" "video list" "bar list";grid-template-rows:auto auto 1fr;column-gap:16px}h2{grid-area:head}video{grid-area:video;align-self:start}#bar{grid-area:bar;align-self:start}#list{grid-area:list;margin-top:0}}</style>
</head>
<body><main>
<h2>CCTV <span id="state">LIVE</span></h2>
<video id="v" controls autoplay muted playsinline></video>
<div id="bar"><input type="date" id="d"><button id="clr">Clear</button><input id="tok" placeholder="token" style="flex:1"></div>
<div id="list"></div>
<script>
const v=document.getElementById('v'),list=document.getElementById('list'),d=document.getElementById('d'),tok=document.getElementById('tok'),state=document.getElementById('state');
tok.value=localStorage.getItem('cctv')||'';
function setTok(){localStorage.setItem('cctv',tok.value);if(tok.value)document.cookie='cctv_token='+encodeURIComponent(tok.value)+';path=/;samesite=strict';else document.cookie='cctv_token=;path=/;max-age=0';}
setTok();
const T=(hasQ)=>tok.value?((hasQ?'&token=':'?token=')+encodeURIComponent(tok.value)):'';
let hls=null,mode='live',liveHour=null;

// URL state: ?file=archive_YYYY-MM-DD-HH.mp4&t=<seconds>; no params = live.
// replaceState only: URL always shareable, back button never steps through seconds.
function setUrl(file,t){
  const p=new URLSearchParams();
  if(file){p.set('file',file);if(typeof t==='number'&&t>0)p.set('t',String(Math.floor(t)));}
  const q=p.toString();
  history.replaceState(null,'',q?('?'+q):location.pathname);
}
let lastUrlWrite=0;
function writeUrlNow(){if(mode==='live')return;lastUrlWrite=Date.now();setUrl(mode,v.currentTime);}
v.addEventListener('timeupdate',()=>{if(mode==='live'||v.paused)return;if(Date.now()-lastUrlWrite<3000)return;writeUrlNow();});
v.addEventListener('seeked',writeUrlNow);
v.addEventListener('pause',writeUrlNow);

function playLive(poll){
  fetch('/api/live'+T()).then(r=>{
    if(r.status===401){state.textContent='need token';return null;}
    if(r.status===404){state.textContent='waiting for live…';setTimeout(()=>{if(mode==='live')playLive();},5000);return null;}
    return r.json();
  }).then(j=>{
    if(!j)return;
    if(poll&&mode!=='live'){
      if(j.hour!==liveHour)state.textContent='LIVE moved to '+j.hour;
      return;
    }
    if(mode==='live'&&j.hour===liveHour){state.textContent='LIVE '+j.hour;return;}
    liveHour=j.hour;
    mode='live';setUrl(null);
    state.textContent='LIVE '+j.hour;
    if(Hls.isSupported()){if(hls)hls.destroy();hls=new Hls();hls.loadSource(j.playlist_url+T());hls.attachMedia(v);v.play().catch(()=>{});}
    else{v.src=j.playlist_url+T();v.play().catch(()=>{});}
    mark();
  });
}
function playMp4(n,t){
  mode=n;
  if(hls){hls.destroy();hls=null;}
  v.src='/video/'+encodeURIComponent(n)+T();
  if(typeof t==='number'&&t>0)v.addEventListener('loadedmetadata',()=>{v.currentTime=t;},{once:true});
  v.play().catch(()=>{});
  document.getElementById('state').textContent=n;
  mark();
  lastUrlWrite=Date.now();setUrl(n,t);
}
function mark(){[...list.children].forEach(b=>b.classList.toggle('active',(b.dataset.n||'live')===mode));}
function load(){
  const q=d.value?('?date='+d.value):'';
  return fetch('/api/files'+q+T(!!q)).then(r=>{
    if(r.status===401){document.getElementById('state').textContent='need token';return[];}
    return r.json();
  }).then(fs=>{
    list.innerHTML='';
    const live=document.createElement('button');
    live.className='row live';live.textContent='🔴 LIVE — back to live';
    live.onclick=()=>playLive();live.dataset.n='live';list.appendChild(live);
    const sum={},cnt={};
    fs.forEach(f=>{const dd=f.hour.slice(0,10);sum[dd]=(sum[dd]||0)+f.size;cnt[dd]=(cnt[dd]||0)+1;});
    const fmt=b=>b>=1073741824?(b/1073741824).toFixed(1)+' GB':(b/1048576).toFixed(1)+' MB';
    let day='';
    fs.forEach(f=>{
      const dd=f.hour.slice(0,10);
      if(dd!==day){day=dd;const h=document.createElement('div');h.className='day';h.dataset.n='day';h.textContent=dd+' — '+fmt(sum[dd])+' · '+cnt[dd]+' file'+(cnt[dd]>1?'s':'');list.appendChild(h);}
      const b=document.createElement('button');
      b.className='row';b.dataset.n=f.name;
      b.textContent=f.hour.slice(11)+':00 — '+(f.size/1048576).toFixed(1)+' MB';
      b.onclick=()=>playMp4(f.name);list.appendChild(b);
    });
    mark();
  });
}
// Restore from URL params, else live. Unknown file (deleted by retention) → live fallback.
function boot(){
  const params=new URLSearchParams(location.search);
  const f=params.get('file');
  const t=Math.max(0,Math.floor(parseFloat(params.get('t'))||0));
  if(f){
    const date=f.startsWith('archive_')?f.slice(8,18):'';
    if(/^\d{4}-\d{2}-\d{2}$/.test(date))d.value=date;
    load().then(()=>{
      const found=[...list.children].some(b=>b.dataset.n===f);
      if(found)playMp4(f,t);else playLive();
    });
    return;
  }
  load();
  playLive();
}
d.onchange=load;
document.getElementById('clr').onclick=()=>{d.value='';load();};
tok.onchange=()=>{setTok();load();if(mode==='live')playLive();};
boot();
setInterval(()=>{load();playLive(true);},60000);
</script>
</main></body></html>
